name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (BRIDGESOFHOPE) — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BRIDGESOFHOPE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BRIDGESOFHOPE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile (CapstoneMobile) — lint + typecheck (non-blocking)
    runs-on: ubuntu-latest
    # Known pre-existing baseline issues (StyleSheet.absoluteFillObject typings, a couple of
    # react-hooks lint rules) predate this workflow — reported here but not yet a hard gate.
    # Flip continue-on-error to false once those are cleaned up.
    continue-on-error: true
    defaults:
      run:
        working-directory: CapstoneMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CapstoneMobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
